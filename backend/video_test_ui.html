<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge AI Image Tester - Prototyping</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00C7BE; /* Teal for clean image detection */
            --bg: #000000;
            --card: #1C1C1E;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            margin-bottom: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .main-card {
            background: var(--card);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        #previewBox {
            max-width: 100%;
            max-height: 400px;
            border-radius: 16px;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .drop-zone {
            width: 100%;
            height: 200px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(0,199,190,0.05);
        }
        .results-section {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 1.5rem;
            display: none;
        }
        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .label { color: #8E8E93; }
        .value { font-weight: 600; color: var(--primary); }
        button {
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: black;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Edge AI Image Tester</h1>
            <p style="opacity: 0.6; margin-top: 8px;">Standalone technical extraction via local Moondream AI</p>
        </header>

        <div class="main-card">
            <div class="upload-section">
                <input type="file" id="imgUpload" accept="image/*" style="display:none;">
                <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgUpload').click()">
                    <span id="dropText">📸 Upload or Drop AC Photo</span>
                    <img id="previewBox" src="">
                </div>
                <button id="extractBtn" disabled>Analyze with Local LLM</button>
            </div>

            <div class="results-section" id="resultsBox">
                <h3 style="margin-bottom: 1rem;">Intelligence Extraction Results</h3>
                <div class="spec-row">
                    <span class="label">Brand:</span>
                    <span class="value" id="brandVal">-</span>
                </div>
                <div class="spec-row">
                    <span class="label">BTU Rating:</span>
                    <span class="value" id="btuVal">-</span>
                </div>
                <div class="spec-row">
                    <span class="label">Inverter Technology:</span>
                    <span class="value" id="invVal">-</span>
                </div>
                <p style="font-size: 0.8rem; opacity: 0.4; margin-top: 20px; text-align: center;">
                    <i>Note: In this standalone UI, results are simulated. For live results, use the main dashboard.</i>
                </p>
            </div>
        </div>
    </div>

    <script>
        const imgUpload = document.getElementById('imgUpload');
        const previewBox = document.getElementById('previewBox');
        const extractBtn = document.getElementById('extractBtn');
        const dropText = document.getElementById('dropText');
        const resultsBox = document.getElementById('resultsBox');

        imgUpload.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                previewBox.src = URL.createObjectURL(file);
                previewBox.style.display = 'block';
                dropText.style.display = 'none';
                extractBtn.disabled = false;
            }
        };

        extractBtn.onclick = () => {
            resultsBox.style.display = 'block';
            extractBtn.textContent = 'Analysing...';
            extractBtn.disabled = true;

            setTimeout(() => {
                document.getElementById('brandVal').textContent = 'GREE';
                document.getElementById('btuVal').textContent = '12000 BTU';
                document.getElementById('invVal').textContent = 'YES (Detected)';
                extractBtn.textContent = 'Analysis Complete';
            }, 1500);
        };
    </script>
</body>
</html>
