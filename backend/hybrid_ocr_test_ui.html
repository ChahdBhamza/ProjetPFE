<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid OCR Pipeline | DetectionAppPFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: #0F172A;
            --terminal: #1E293B;
            --primary: #F59E0B;  /* Amber color for hybrid */
            --text: #F8FAFC;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .nav-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-zone {
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        .upload-zone:hover {
            border-color: var(--primary);
        }

        #preview {
            max-width: 400px;
            max-height: 300px;
            border-radius: 12px;
            margin: 1.5rem auto;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn {
            background: var(--primary);
            color: #020617;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            display: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
        }

        .btn:active { transform: scale(0.95); }

        .pipeline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            display: none;
        }

        .terminal {
            background: var(--terminal);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            min-height: 300px;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            justify-content: space-between;
        }

        .dot-container {
            display: flex;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #FF5F56; }
        .yellow { background: #FFBD2E; }
        .green { background: #27C93F; }

        .terminal-label {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .timer-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
        }

        .output-box {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #CBD5E1;
            line-height: 1.6;
            white-space: pre-wrap;
            margin: 0;
            overflow-y: auto;
            max-height: 350px;
        }

        .loading-text {
            color: var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/" class="nav-link">🏠 DASHBOARD</a>
            <a href="/edge" class="nav-link">⚡ EDGE-AI</a>
            <a href="/ocr" class="nav-link">⚖️ OCR COMPARISON</a>
            <a href="/classic-ocr" class="nav-link">📠 CLASSIC OCR</a>
        </nav>

        <header class="header">
            <h1>⚡ Hybrid OCR Pipeline</h1>
            <p style="opacity: 0.6;">Dual-Pass EasyOCR + Local Text LLM (Fast Extraction)</p>
        </header>

        <div class="upload-zone">
            <label for="fileInput" style="cursor:pointer;">
                <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚡</div>
                <p style="font-size: 1.2rem; margin-bottom: 5px;">Upload AC Label</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </label>
            <img id="preview">
            <br>
            <button id="extractBtn" class="btn">RUN HYBRID PIPELINE</button>
        </div>

        <div class="pipeline-grid" id="pipelineGrid">
            <!-- Step 1 Terminal -->
            <div class="terminal">
                <div class="terminal-header">
                    <div class="dot-container">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                    <span class="terminal-label">STEP 1: EasyOCR (Text)</span>
                    <span class="timer-badge" id="ocrTimer">0.00s</span>
                </div>
                <pre class="output-box" id="ocrOutput">Waiting for pipeline...</pre>
            </div>

            <!-- Step 2 Terminal -->
            <div class="terminal">
                <div class="terminal-header">
                    <div class="dot-container">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                    <span class="terminal-label">STEP 2: LLM (JSON)</span>
                    <span class="timer-badge" id="llmTimer">0.00s</span>
                </div>
                <pre class="output-box" id="llmOutput" style="color: #6EE7B7;">Waiting for Step 1...</pre>
            </div>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const extractBtn = document.getElementById('extractBtn');
        const pipelineGrid = document.getElementById('pipelineGrid');
        
        const ocrOutput = document.getElementById('ocrOutput');
        const llmOutput = document.getElementById('llmOutput');
        const ocrTimer = document.getElementById('ocrTimer');
        const llmTimer = document.getElementById('llmTimer');

        fileInput.onchange = e => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = f => {
                    preview.src = f.target.result;
                    preview.style.display = 'block';
                    extractBtn.style.display = 'inline-block';
                    pipelineGrid.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        };

        extractBtn.onclick = async () => {
            pipelineGrid.style.display = 'grid';
            extractBtn.disabled = true;
            extractBtn.style.opacity = '0.5';
            
            ocrOutput.innerHTML = '<span class="loading-text">> Auto-Scanning multiple languages...</span>';
            llmOutput.innerHTML = '<span style="color:#64748B;">> Waiting for OCR raw string...</span>';
            ocrTimer.textContent = "RUNNING";
            llmTimer.textContent = "STANDBY";

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/ocr/hybrid', { method: 'POST', body: formData });
                const data = await response.json();
                
                extractBtn.disabled = false;
                extractBtn.style.opacity = '1';

                if (data.success) {
                    ocrOutput.textContent = data.raw_text;
                    llmOutput.textContent = JSON.stringify(data.structured_data, null, 2);
                    
                    ocrTimer.textContent = data.timing.ocr_seconds + "s";
                    llmTimer.textContent = data.timing.llm_seconds + "s";
                } else {
                    ocrOutput.textContent = "PROCESS FAILED:\n" + data.error;
                    llmOutput.textContent = "ABORTED.";
                }

            } catch (err) {
                ocrOutput.textContent = "Network Error: Could not connect to Hybrid API.";
                llmOutput.textContent = "ABORTED.";
                extractBtn.disabled = false;
                extractBtn.style.opacity = '1';
            }
        };
    </script>
</body>
</html>
