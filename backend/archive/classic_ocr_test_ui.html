<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic OCR Terminal | DetectionAppPFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: #0F172A;
            --terminal: #1E293B;
            --primary: #F472B6;  /* Pink/Accent color to distinguish it from the VLM UI */
            --text: #F8FAFC;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .nav-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-zone {
            background: var(--card);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 2rem;
            transition: border-color 0.3s;
        }

        .upload-zone:hover {
            border-color: var(--primary);
        }

        #preview {
            max-width: 400px;
            max-height: 300px;
            border-radius: 12px;
            margin: 1.5rem 0;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .terminal {
            background: var(--terminal);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            min-height: 250px;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #FF5F56; }
        .yellow { background: #FFBD2E; }
        .green { background: #27C93F; }

        .terminal-label {
            margin-left: 10px;
            font-size: 0.8rem;
            color: #64748B;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #classicOutput {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #CBD5E1;
            line-height: 1.6;
            white-space: pre-wrap;
            margin: 0;
            overflow-y: auto;
            max-height: 400px;
        }

        .loading-text {
            color: var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            background: var(--primary);
            color: #020617;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2rem;
            display: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 114, 182, 0.6);
        }

        .btn:active { transform: scale(0.95); }

        .instruction {
            color: #64748B;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/" class="nav-link">🏠 DASHBOARD</a>
            <a href="/edge" class="nav-link">⚡ EDGE-AI</a>
            <a href="/ocr" class="nav-link">🔬 OCR COMPARISON</a>
        </nav>

        <header class="header">
            <h1>Classic OCR Engine</h1>
            <p style="opacity: 0.6;">Raw Tesseract Binary Extraction</p>
        </header>

        <div class="upload-zone">
            <label for="fileInput" style="cursor:pointer;">
                <div style="font-size: 3.5rem; margin-bottom: 1rem;">📠</div>
                <p style="font-size: 1.2rem; margin-bottom: 5px;">Upload Image</p>
                <p class="instruction">We will extract the raw text using traditional OCR logic.</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </label>
            <img id="preview">
            <br>
            
            <select id="langCombo" class="btn" style="display:none; padding: 12px; margin-right: 15px; margin-top:20px; border: 2px solid var(--primary); background: transparent; color: var(--text);">
                <option value="en_fr" style="background: var(--card);">🇬🇧 / 🇫🇷 English & French</option>
                <option value="ar_en" style="background: var(--card);">🇹🇳 / 🇬🇧 Arabic & English</option>
                <option value="ar_fr" style="background: var(--card);">🇹🇳 / 🇫🇷 Arabic & French (Dual-Pass)</option>
            </select>

            <button id="extractBtn" class="btn">RUN CLASSIC SCAN</button>
        </div>

        <div class="terminal">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span class="terminal-label" style="color: var(--primary);">Classic Tesseract Output</span>
            </div>
            <pre id="classicOutput">System ready. Awaiting image upload...</pre>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const extractBtn = document.getElementById('extractBtn');
        const langCombo = document.getElementById('langCombo');
        const classicOutput = document.getElementById('classicOutput');

        fileInput.onchange = e => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = f => {
                    preview.src = f.target.result;
                    preview.style.display = 'block';
                    extractBtn.style.display = 'inline-block';
                    langCombo.style.display = 'inline-block';
                    classicOutput.textContent = "Image loaded.";
                }
                reader.readAsDataURL(file);
            }
        };

        extractBtn.onclick = async () => {
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('lang_combo', langCombo.value);

            extractBtn.disabled = true;
            extractBtn.style.opacity = '0.5';
            classicOutput.innerHTML = '<span class="loading-text">>> LOADING MODELS...\n>> SCANNING PIXELS...</span>';

            try {
                const response = await fetch('/api/ocr/classic', { method: 'POST', body: formData });
                const data = await response.json();
                
                extractBtn.disabled = false;
                extractBtn.style.opacity = '1';

                if (data.status === 'success') {
                    classicOutput.textContent = data.raw_text || "No text detected by Classic OCR.";
                } else {
                    classicOutput.textContent = "Error: " + (data.error || "Unknown OCR error occurred.");
                }

            } catch (err) {
                classicOutput.textContent = "Network Error: Could not connect to OCR service.";
                extractBtn.disabled = false;
                extractBtn.style.opacity = '1';
            }
        };
    </script>
</body>
</html>
