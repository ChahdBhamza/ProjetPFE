<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Bounding Box Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        h1 {
            color: #4CAF50;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #4CAF50;
            padding: 40px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .upload-area:hover {
            background-color: #2a2a2a;
        }
        #file-input {
            display: none;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .image-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 15px;
        }
        .loading {
            display: none;
            margin: 20px 0;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>YOLO Bounding Box Visualizer</h1>
    
    <div class="container">
        <p>Upload an image to see how YOLO detects and bounds the objects.</p>
        
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <p id="upload-text">Click to browse or drag an image here</p>
            <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <button class="btn" id="analyze-btn" onclick="analyzeImage()" disabled>Run YOLO Inference</button>

        <div class="loading" id="loading-indicator">
            Processing image through Neural Network...
        </div>

        <div class="image-preview" id="result-container" style="display: none;">
            <h3>YOLO Result:</h3>
            <img id="result-image" src="" alt="YOLO Result">
            
            <h3 style="margin-top: 30px; color: #4CAF50;">Extracted OCR Text:</h3>
            <div id="ocr-result" style="background: #2a2a2a; padding: 15px; border-radius: 8px; width: 100%; text-align: left; white-space: pre-wrap; font-family: monospace; min-height: 50px;"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('upload-text').innerText = `Selected: ${file.name}`;
                document.getElementById('analyze-btn').disabled = false;
                
                // Hide previous results
                document.getElementById('result-container').style.display = 'none';
            }
        }

        async function analyzeImage() {
            if (!selectedFile) return;

            const btn = document.getElementById('analyze-btn');
            const loading = document.getElementById('loading-indicator');
            const resultContainer = document.getElementById('result-container');
            const resultImage = document.getElementById('result-image');

            // Set UI to loading state
            btn.disabled = true;
            loading.style.display = 'block';
            resultContainer.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // Call the FastAPI endpoint
                const response = await fetch('/api/yolo/test', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                // The response is an image blob
                const imageBlob = await response.blob();
                const imageObjectURL = URL.createObjectURL(imageBlob);
                
                // Display the image
                resultImage.src = imageObjectURL;
                resultContainer.style.display = 'flex';
                
                // --- NOW RUN HYBRID VISION LLM ON THE SAME IMAGE ---
                document.getElementById('ocr-result').innerHTML = "<i>Waking up Vision LLM (Neural Net)... This may take 15-30 seconds to read the logo perfectly...</i>";
                
                try {
                    const ocrResponse = await fetch('/api/ocr', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (ocrResponse.ok) {
                        const ocrData = await ocrResponse.json();
                        let displayHTML = `<div style="color: #4CAF50; font-weight: bold; margin-bottom: 10px;">[Gemini 2.5] Vision Analysis Complete:</div>`;
                        
                        // Show Structured Data if it exists
                        if (ocrData.structured_data) {
                            const sd = ocrData.structured_data;
                            displayHTML += `
                            <div style="background: #111; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 15px;">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                    <div><strong>Brand:</strong> <span style="color: #00d2ff;">${sd.brand || 'N/A'}</span></div>
                                    <div><strong>BTU:</strong> <span style="color: #00d2ff;">${sd.btu || 'N/A'}</span></div>
                                    <div><strong>Model Ref:</strong> <span style="color: #00d2ff;">${sd.model_reference || 'N/A'}</span></div>
                                    <div><strong>Confidence:</strong> <span style="color: #00d2ff;">${(sd.confidence * 100).toFixed(0)}%</span></div>
                                </div>
                                <div style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; font-style: italic; color: #aaa;">
                                    "${sd.analysis || ''}"
                                </div>
                            </div>`;
                        } else {
                            displayHTML += `<div style="background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333; white-space: pre-wrap;">${ocrData.raw_text || "No text detected."}</div>`;
                        }
                        
                        document.getElementById('ocr-result').innerHTML = displayHTML;
                    } else {
                        document.getElementById('ocr-result').innerText = "OCR Failed or endpoint unavailable.";
                    }
                } catch (e) {
                    document.getElementById('ocr-result').innerText = "OCR Error: " + e.message;
                }
                
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during inference. Check console for details.');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
