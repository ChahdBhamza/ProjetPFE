<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight | Unified AI Test Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #0d0d0d;
            --primary: #00f2ff;
            --secondary: #7000ff;
            --text: #ffffff;
            --accent: #ff0055;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.05) 0%, transparent 40%);
        }

        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .tab.active {
            background: var(--glass);
            color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        main {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .upload-area {
            width: 100%;
            height: 300px;
            border: 2px dashed var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: var(--glass);
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        #preview, #video-preview {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 18px;
            display: none;
        }

        .btn-primary {
            width: 100%;
            padding: 1.2rem;
            margin-top: 1.5rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:disabled {
            filter: grayscale(1);
            opacity: 0.5;
        }

        .video-timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 800px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .frame-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 1.5rem;
            transition: 0.3s;
        }

        .frame-card:hover {
            border-color: var(--primary);
            background: rgba(0, 242, 255, 0.03);
        }

        .frame-thumb {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .frame-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .tag-yolo { background: #00f2ff; color: #000; }
        .tag-roboflow { background: #7000ff; color: #fff; }
        .tag-none { background: #333; color: #aaa; }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 242, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="logo">CYBERSIGHT AI</div>
        <div class="status-badge" id="mode-status">Image Mode</div>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchMode('image')">📸 IMAGE SCAN</div>
        <div class="tab" onclick="switchMode('video')">🎬 VIDEO STREAM</div>
    </div>

    <main>
        <!-- LEFT COLUMN: CONTROL -->
        <div class="card">
            <h2 id="upload-title">1. Upload Image</h2>
            
            <div id="image-upload-zone" class="upload-area" onclick="document.getElementById('imageInput').click()">
                <p>Drop image or click to browse</p>
                <img id="preview">
            </div>

            <div id="video-upload-zone" class="upload-area" style="display: none;" onclick="document.getElementById('videoInput').click()">
                <p>Drop .mp4 or click to browse</p>
                <video id="video-preview" muted></video>
            </div>

            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleFile(event, 'image')">
            <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="handleFile(event, 'video')">
            
            <button class="btn-primary" id="actionBtn" disabled onclick="process()">
                RUN UNIFIED SCAN
            </button>
        </div>

        <!-- RIGHT COLUMN: RESULTS -->
        <div class="results-panel">
            <!-- IMAGE RESULTS -->
            <div id="image-results" class="card">
                <h2>Forensic Analysis</h2>
                <div id="image-placeholder" style="text-align: center; color: #333; padding: 5rem 0;">
                    Awaiting capture...
                </div>
                <div id="image-display" style="display: none;">
                    <img id="result-img" style="width: 100%; border-radius: 12px; border: 1px solid var(--border);">
                    <div style="margin-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div style="background: var(--glass); padding: 1rem; border-radius: 12px;">
                            <p style="font-size: 0.7rem; opacity: 0.5;">DETECTION</p>
                            <p id="res-cat" style="font-weight: 800; color: var(--primary);">-</p>
                        </div>
                        <div style="background: var(--glass); padding: 1rem; border-radius: 12px;">
                            <p style="font-size: 0.7rem; opacity: 0.5;">ENGINE</p>
                            <p id="res-src" style="font-weight: 800;">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIDEO RESULTS -->
            <div id="video-results" class="card" style="display: none;">
                <h2>Stream Timeline</h2>
                <div id="video-timeline" class="video-timeline">
                    <!-- Frame cards will appear here -->
                    <p style="text-align: center; color: #333; padding: 5rem 0;">Process video to see timeline...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-weight: 800; letter-spacing: 2px;">NEURAL LINK PROCESSING...</p>
    </div>

    <script>
        let currentMode = 'image';

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('mode-status').textContent = mode === 'image' ? 'Image Mode' : 'Video Stream Mode';
            document.getElementById('upload-title').textContent = mode === 'image' ? '1. Upload Image' : '1. Upload Video';
            
            document.getElementById('image-upload-zone').style.display = mode === 'image' ? 'flex' : 'none';
            document.getElementById('video-upload-zone').style.display = mode === 'video' ? 'flex' : 'none';
            
            document.getElementById('image-results').style.display = mode === 'image' ? 'block' : 'none';
            document.getElementById('video-results').style.display = mode === 'video' ? 'block' : 'none';
            
            document.getElementById('actionBtn').disabled = true;
            document.getElementById('actionBtn').textContent = mode === 'image' ? 'RUN UNIFIED SCAN' : 'ANALYZE STREAM';
        }

        function handleFile(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            if (type === 'image') {
                const prev = document.getElementById('preview');
                prev.src = url;
                prev.style.display = 'block';
            } else {
                const prev = document.getElementById('video-preview');
                prev.src = url;
                prev.style.display = 'block';
                prev.load();
            }
            document.getElementById('actionBtn').disabled = false;
        }

        async function process() {
            const input = currentMode === 'image' ? document.getElementById('imageInput') : document.getElementById('videoInput');
            if (input.files.length === 0) return;

            document.getElementById('loading').style.display = 'flex';
            const formData = new FormData();
            formData.append('file', input.files[0]);

            const endpoint = currentMode === 'image' ? '/api/detect/unified' : '/api/video/unified-stream';

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await response.json();

                if (currentMode === 'image') {
                    renderImageResult(data);
                } else {
                    renderVideoResults(data);
                }
            } catch (e) {
                alert("AI Engine Error: " + e.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderImageResult(data) {
            document.getElementById('image-placeholder').style.display = 'none';
            document.getElementById('image-display').style.display = 'block';
            document.getElementById('result-img').src = `data:image/jpeg;base64,${data.image}`;
            document.getElementById('res-cat').textContent = data.category.toUpperCase();
            document.getElementById('res-src').textContent = data.source.toUpperCase();
        }

        function renderVideoResults(data) {
            const container = document.getElementById('video-timeline');
            container.innerHTML = '';

            if (!data.results || data.results.length === 0) {
                container.innerHTML = '<p>No equipment found in stream.</p>';
                return;
            }

            data.results.forEach(res => {
                const analysis = res.analysis;
                const isKnown = analysis.is_known_equipment;
                
                const card = document.createElement('div');
                card.className = 'frame-card';
                card.innerHTML = `
                    <img src="data:image/jpeg;base64,${analysis.image}" class="frame-thumb">
                    <div class="frame-info">
                        <span class="tag ${isKnown ? (analysis.source === 'yolov5' ? 'tag-yolo' : 'tag-roboflow') : 'tag-none'}">
                            ${analysis.source.toUpperCase()}
                        </span>
                        <h3 style="color: ${isKnown ? 'var(--primary)' : '#555'}">
                            ${analysis.category.toUpperCase()}
                        </h3>
                        <p style="font-size: 0.8rem; opacity: 0.6;">Frame Index: ${res.frame_idx}</p>
                        <p style="font-size: 0.8rem; margin-top: 0.5rem;">
                            Status: ${isKnown ? '✅ Tracked Equipment' : '❌ Unrecognized'}
                        </p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
</body>
</html>
