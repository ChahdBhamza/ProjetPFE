<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight - Global Analytics</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* slate-800 with opacity */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
    </style>
</head>
<body class="min-h-screen p-8">
    
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            Cybersight Forensic Analytics
        </h1>
        <p class="text-slate-400 mt-2">Global System Metrics & Detection Data</p>
    </header>

    <!-- Key Metrics Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 max-w-5xl mx-auto">
        <!-- Total Detections -->
        <div class="glass-panel p-6 flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm uppercase tracking-wider font-semibold">Total Detections</p>
                <h2 id="totalDetections" class="text-4xl font-bold text-blue-400 mt-2">--</h2>
            </div>
            <div class="p-4 bg-blue-500/20 rounded-full">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </div>
        </div>

        <!-- Total Users -->
        <div class="glass-panel p-6 flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm uppercase tracking-wider font-semibold">Active Operators</p>
                <h2 id="totalUsers" class="text-4xl font-bold text-emerald-400 mt-2">--</h2>
            </div>
            <div class="p-4 bg-emerald-500/20 rounded-full">
                <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 max-w-6xl mx-auto">
        
        <!-- Bar Chart: Top Brands -->
        <div class="glass-panel p-6">
            <h3 class="text-lg font-semibold text-slate-200 mb-4">Top Identified Brands</h3>
            <div class="relative h-64">
                <canvas id="brandsChart"></canvas>
            </div>
        </div>

        <!-- Line Chart: Detections Over Time -->
        <div class="glass-panel p-6">
            <h3 class="text-lg font-semibold text-slate-200 mb-4">Detection Timeline (Last 7 Days)</h3>
            <div class="relative h-64">
                <canvas id="timelineChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        // Chart Instances
        let brandsChartInstance = null;
        let timelineChartInstance = null;

        // Fetch Data from Backend
        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics/dashboard');
                const result = await response.json();
                
                if(result.success) {
                    const data = result.data;
                    
                    // Update Key Metrics
                    document.getElementById('totalDetections').innerText = data.total_detections;
                    document.getElementById('totalUsers').innerText = data.total_users;

                    // Prepare Brand Data
                    const brandLabels = data.top_brands.map(b => b.brand);
                    const brandCounts = data.top_brands.map(b => b.count);

                    // Prepare Timeline Data
                    const timeLabels = data.timeline.map(t => t.date);
                    const timeCounts = data.timeline.map(t => t.count);

                    // Render Charts
                    renderBrandsChart(brandLabels, brandCounts);
                    renderTimelineChart(timeLabels, timeCounts);

                } else {
                    console.error("Backend Error:", result.error);
                    alert("Failed to load analytics: " + result.error);
                }
            } catch (error) {
                console.error("Network Error:", error);
            }
        }

        function renderBrandsChart(labels, data) {
            const ctx = document.getElementById('brandsChart').getContext('2d');
            
            if(brandsChartInstance) brandsChartInstance.destroy();

            brandsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Detections',
                        data: data,
                        backgroundColor: 'rgba(96, 165, 250, 0.5)', // blue-400 with opacity
                        borderColor: 'rgb(96, 165, 250)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' } // slate-400
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        function renderTimelineChart(labels, data) {
            const ctx = document.getElementById('timelineChart').getContext('2d');
            
            if(timelineChartInstance) timelineChartInstance.destroy();

            timelineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Scans',
                        data: data,
                        backgroundColor: 'rgba(52, 211, 153, 0.1)', // emerald-400
                        borderColor: 'rgb(52, 211, 153)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4 // Smooth curves
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', loadAnalytics);

    </script>
</body>
</html>
