<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboflow Workflow Test</title>
    <style>
        :root {
            --primary: #f52c5c;
            --secondary: #1a1a1a;
            --accent: #ff4d79;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #f52c5c, #ff4d79);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #888;
            font-weight: 500;
        }

        select, input[type="file"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .upload-area {
            border: 2px dashed #444;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #222;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            display: none;
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 30px;
        }

        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Roboflow Vision Lab</h1>
            <p>Connect to your custom workflows in real-time</p>
        </header>

        <div class="card">
            <div class="controls">
                <div class="form-group">
                    <label>Select Workflow</label>
                    <select id="workflowId">
                        <option value="detect-count-and-visualize">detect-count-and-visualize (PC/General)</option>
                        <option value="refrigerator-detector-1778362486109">refrigerator-detector (Fridge)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload Image</label>
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <p id="uploadText">Click to select an image</p>
                        <input type="file" id="fileInput" hidden accept="image/*">
                    </div>
                </div>

                <button id="detectBtn" disabled>Run Inference</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Roboflow is processing...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-section" id="results">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="countVal">0</div>
                        <div class="stat-label">Objects Found</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="workflowVal">-</div>
                        <div class="stat-label">Active Workflow</div>
                    </div>
                </div>
                
                <div class="image-container">
                    <img id="resultImage" src="" alt="Result">
                </div>

                <div id="detectionsList"></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadText = document.getElementById('uploadText');
        const detectBtn = document.getElementById('detectBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const resultImage = document.getElementById('resultImage');
        const countVal = document.getElementById('countVal');
        const workflowVal = document.getElementById('workflowVal');
        const workflowSelect = document.getElementById('workflowId');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadText.innerText = e.target.files[0].name;
                detectBtn.disabled = false;
            }
        });

        detectBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            const workflowId = workflowSelect.value;
            
            if (!file) return;

            // Reset
            error.style.display = 'none';
            results.style.display = 'none';
            loading.style.display = 'block';
            detectBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`/api/roboflow/detect?workflow_id=${workflowId}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server error');
                }

                // Display
                resultImage.src = `data:image/jpeg;base64,${data.image}`;
                countVal.innerText = data.total;
                workflowVal.innerText = data.workflow;
                
                loading.style.display = 'none';
                results.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.innerText = err.message;
                error.style.display = 'block';
            } finally {
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
