<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Vision | Video Intelligence Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #111827;
            --surface-accent: #1f2937;
            --primary: #8b5cf6; /* Purple for video/motion */
            --primary-glow: rgba(139, 92, 246, 0.5);
            --accent: #ec4899;
            --text: #f9fafb;
            --text-dim: #9ca3af;
            --border: rgba(255, 255, 255, 0.05);
            --glass: rgba(17, 24, 39, 0.7);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 5%;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { color: var(--text-dim); font-size: 1.1rem; }

        .upload-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 3rem;
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.03);
        }

        #videoPreview {
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            margin-top: 2rem;
            display: none;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 99px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px var(--primary-glow);
            margin-top: 2rem;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px var(--primary-glow);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Frames Grid */
        .frames-container {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .frames-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* Pipeline Styles */
        .frames-grid {
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .pipeline-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .pipeline-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .pipeline-steps {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .step {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .step-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .step img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .crop-container {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16/9;
            overflow: hidden;
            border: 1px solid var(--primary-glow);
        }

        .final-crop {
            width: auto !important;
            height: 100% !important;
            object-fit: contain !important;
            border: none !important;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 2rem auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">PRO-VISION</div>
        <div style="font-size: 0.8rem; color: var(--text-dim);">VIDEO EXTRACTION MODULE</div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Intelligent Frame Extraction</h1>
            <p>Processing video streams to capture high-clarity keyframes for product identification.</p>
        </div>

        <div class="upload-card">
            <div class="drop-zone" onclick="document.getElementById('videoInput').click()">
                <div style="font-size: 4rem; margin-bottom: 1rem;">🎥</div>
                <h3>Upload Video Source</h3>
                <p style="color: var(--text-dim);">Select an MP4 or MOV file to extract frames</p>
                <input type="file" id="videoInput" accept="video/*" style="display:none;">
            </div>

            <video id="videoPreview" controls></video>

            <div id="loader" class="loader"></div>
            
            <button id="extractBtn" class="btn-primary" style="display: none;">Extract Key Frames</button>
        </div>

        <div id="framesSection" class="frames-container">
            <div class="frames-header">
                <h2>Extracted Key Frames</h2>
                <span id="frameCount" style="color: var(--text-dim); font-size: 0.9rem;"></span>
            </div>
            <div id="framesGrid" class="frames-grid">
                <!-- Frames will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const extractBtn = document.getElementById('extractBtn');
        const loader = document.getElementById('loader');
        const framesSection = document.getElementById('framesSection');
        const framesGrid = document.getElementById('framesGrid');
        const frameCountLabel = document.getElementById('frameCount');

        videoInput.onchange = e => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                extractBtn.style.display = 'inline-block';
                framesSection.style.display = 'none';
            }
        };

        extractBtn.onclick = async () => {
            const file = videoInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('auto_search', 'false');

            loader.style.display = 'block';
            extractBtn.disabled = true;
            extractBtn.textContent = 'Processing Video...';

            try {
                const response = await fetch('/api/video/extract-frames', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                loader.style.display = 'none';
                extractBtn.disabled = false;
                extractBtn.textContent = 'Extract Key Frames';

                if (data.success) {
                    displayFrames(data.frames);
                } else {
                    alert("Extraction failed: " + (data.error || "Unknown error"));
                }
            } catch (err) {
                console.error(err);
                alert("Connection error to backend");
                loader.style.display = 'none';
                extractBtn.disabled = false;
            }
        };

        function displayFrames(frames) {
            framesGrid.innerHTML = '';
            framesSection.style.display = 'block';
            frameCountLabel.textContent = `${frames.length} frames detected`;

            frames.forEach((data, idx) => {
                const card = document.createElement('div');
                card.className = 'pipeline-container';
                card.innerHTML = `
                    <div class="pipeline-header">
                        <span class="frame-idx">#${idx + 1} - ANALYSIS PIPELINE (FRAME ${data.frame_idx})</span>
                    </div>
                    <div class="pipeline-steps">
                        <div class="step">
                            <div class="step-label">1. RAW CAPTURE</div>
                            <img src="data:image/jpeg;base64,${data.raw}" alt="Raw ${idx}">
                        </div>
                        <div class="step">
                            <div class="step-label">2. YOLO DETECTION</div>
                            <img src="data:image/jpeg;base64,${data.boxed}" alt="Boxed ${idx}">
                        </div>
                        <div class="step">
                            <div class="step-label">3. OPTIMIZED CROP</div>
                            <div class="crop-container">
                                <img src="data:image/jpeg;base64,${data.cropped}" alt="Cropped ${idx}" class="final-crop">
                            </div>
                        </div>
                    </div>
                `;
                framesGrid.appendChild(card);
            });
        }

        window.downloadFrame = (base64, idx) => {
            const link = document.createElement('a');
            link.href = `data:image/jpeg;base64,${base64}`;
            link.download = `extracted_frame_${idx + 1}.jpg`;
            link.click();
        }
    </script>
</body>
</html>
