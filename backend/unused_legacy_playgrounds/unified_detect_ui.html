<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight | Unified Detection Lab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap');

        :root {
            --bg-color: #0a0a0c;
            --card-bg: #151518;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --text-main: #e0e0e0;
            --text-dim: #888888;
            --success: #00ff88;
            --danger: #ff0055;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .upload-area {
            border: 2px dashed rgba(0, 242, 255, 0.2);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(0, 242, 255, 0.02);
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 242, 255, 0.05);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .img-display {
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #333;
            display: none;
        }

        .result-box {
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            background: #000;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #222;
        }

        .label { color: var(--accent-primary); margin-right: 10px; }
        .val { color: #fff; }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--accent-primary);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .badge-yolo { background: #ffaa00; color: #000; }
        .badge-roboflow { background: #00f2ff; color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>UNIFIED DETECTION LAB</h1>
        <p>Automatic Routing: Laptop (YOLO) | Refrigerator (Roboflow) | AC (Roboflow)</p>
    </div>

    <div class="container">
        <div class="panel">
            <h3 style="margin-top:0">1. UPLOAD IMAGE</h3>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p id="uploadText">Click to upload evidence</p>
                <img id="preview" class="img-display" style="display:none">
                <input type="file" id="fileInput" hidden onchange="previewImage(event)">
            </div>
            <button class="btn" onclick="runDetection()">Execute Automatic Analysis</button>
            <div id="loading" class="loading">Routing to optimal AI pipeline...</div>
        </div>

        <div class="panel">
            <h3 style="margin-top:0">2. DETECTION RESULTS</h3>
            <div id="resultsContent">
                <p style="color: var(--text-dim)">Awaiting visual input...</p>
            </div>
            <img id="resultImage" class="img-display">
        </div>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function runDetection() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return alert("Please select an image first!");

            const loading = document.getElementById('loading');
            const resultsContent = document.getElementById('resultsContent');
            const resultImage = document.getElementById('resultImage');

            loading.style.display = 'block';
            resultsContent.innerHTML = "";
            resultImage.style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/detect/unified', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.error) {
                    resultsContent.innerHTML = `<p style="color: var(--danger)">Error: ${data.error}</p>`;
                    return;
                }

                // UI Rendering
                const badgeClass = data.source === 'yolov5' ? 'badge-yolo' : 'badge-roboflow';
                let html = `
                    <div class="badge ${badgeClass}">${data.source.toUpperCase()} PIPELINE</div>
                    <div class="result-box">
                        <div><span class="label">IDENTIFIED:</span> <span class="val">${data.category.toUpperCase()}</span></div>
                        <hr style="border-color:#222; margin: 10px 0;">
                `;

                if (data.source === 'yolov5') {
                    data.detections.forEach(d => {
                        html += `<div><span class="label">CONFIDENCE:</span> <span class="val">${(d.confidence * 100).toFixed(1)}%</span></div>`;
                    });
                } else {
                    // Roboflow detections
                    const detCount = data.detections.detections ? data.detections.detections.length : 0;
                    html += `<div><span class="label">OBJECTS:</span> <span class="val">${detCount}</span></div>`;
                }

                html += "</div>";
                resultsContent.innerHTML = html;

                if (data.image) {
                    resultImage.src = `data:image/jpeg;base64,${data.image}`;
                    resultImage.style.display = 'block';
                }

            } catch (err) {
                loading.style.display = 'none';
                resultsContent.innerHTML = `<p style="color: var(--danger)">Connection Failed</p>`;
            }
        }
    </script>
</body>
</html>
