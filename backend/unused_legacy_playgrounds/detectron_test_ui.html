<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight | Detectron2 Neural Probe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --accent: #f43f5e;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 2rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .badge {
            background: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        main {
            max-width: 1200px;
            width: 90%;
            padding: 3rem 0;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .upload-zone {
            background: var(--card-bg);
            border: 2px dashed var(--glass-border);
            border-radius: 24px;
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            position: relative;
        }

        .upload-zone:hover {
            border-color: var(--secondary);
            background: rgba(30, 41, 59, 0.9);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        #fileInput { display: none; }

        .result-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            display: none; /* Shown after upload */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .image-card img {
            width: 100%;
            display: block;
            border-bottom: 1px solid var(--glass-border);
        }

        .stats-grid {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .json-card {
            background: #020617;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            max-height: 600px;
            color: #10b981;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(139, 92, 246, 0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .detection-list {
            margin-top: 1rem;
            list-style: none;
        }

        .detection-item {
            background: rgba(255,255,255,0.05);
            margin-bottom: 0.5rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }

        .conf-pill {
            background: rgba(6, 182, 212, 0.2);
            color: var(--secondary);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .result-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">Neural Engine V2</span>
        <h1>Cybersight Detectron Probe</h1>
        <p style="opacity: 0.7;">Advanced Mask R-CNN Instance Segmentation Interface</p>
    </header>

    <main>
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">🚀</span>
            <h2>Initiate Scan</h2>
            <p style="opacity: 0.6; margin-top: 0.5rem;">Drag and drop an image or click to upload</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Processing Neural Tensors...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="image-card">
                <img id="resultImage" src="" alt="Neural Output">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-val" id="countVal">0</span>
                        <span class="stat-label">Detections</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val" id="deviceVal">CPU</span>
                        <span class="stat-label">Compute</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val" id="modelVal">R50-FPN</span>
                        <span class="stat-label">Model</span>
                    </div>
                </div>
                <div style="padding: 0 1.5rem 1.5rem 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1rem;">Detected Entities</h3>
                    <div id="detectionList" class="detection-list"></div>
                </div>
            </div>

            <div class="json-card">
                <div style="margin-bottom: 10px; color: #64748b;">// RAW_TELEMETRY_LOG</div>
                <pre id="jsonOutput"></pre>
            </div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const jsonOutput = document.getElementById('jsonOutput');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleUpload(e.target.files[0]);
        });

        // Drag and Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--secondary)';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'var(--glass-border)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleUpload(e.dataTransfer.files[0]);
        });

        async function handleUpload(file) {
            const formData = new FormData();
            formData.append('file', file);

            // UI Reset
            resultContainer.style.display = 'none';
            loader.style.display = 'flex';
            dropZone.style.opacity = '0.5';
            dropZone.style.pointerEvents = 'none';

            try {
                const response = await fetch('/api/detectron/test', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    renderResults(data);
                } else {
                    alert('Neural Probe Failed: ' + (data.error || 'Unknown Error'));
                }
            } catch (err) {
                alert('Connection Error: ' + err.message);
            } finally {
                loader.style.display = 'none';
                dropZone.style.opacity = '1';
                dropZone.style.pointerEvents = 'auto';
            }
        }

        function renderResults(data) {
            resultImage.src = `data:image/jpeg;base64,${data.annotated_image}`;
            
            document.getElementById('countVal').textContent = data.count;
            document.getElementById('deviceVal').textContent = data.device.toUpperCase();
            document.getElementById('modelVal').textContent = data.model.split('/').pop().split('.')[0];

            // List detections
            const list = document.getElementById('detectionList');
            list.innerHTML = '';
            
            data.detections.forEach(det => {
                const item = document.createElement('div');
                item.className = 'detection-item';
                item.innerHTML = `
                    <span>${det.label}</span>
                    <span class="conf-pill">${(det.score * 100).toFixed(1)}%</span>
                `;
                list.appendChild(item);
            });

            // JSON
            jsonOutput.textContent = JSON.stringify(data, null, 2);
            
            resultContainer.style.display = 'grid';
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
