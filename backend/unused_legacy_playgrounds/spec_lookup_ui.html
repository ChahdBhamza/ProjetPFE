<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight - Agentic Spec Retrieval</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --bg-card-hover: #1a2236;
            --border: rgba(255,255,255,0.08);
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-emerald));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Pipeline Visualization */
        .pipeline-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .pipeline-step {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            transition: all 0.4s ease;
        }

        .pipeline-step.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .pipeline-step.done {
            border-color: var(--accent-emerald);
            background: rgba(16, 185, 129, 0.1);
        }

        .pipeline-step.error {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .pipeline-arrow {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Input Card */
        .input-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-blue);
        }

        .btn-search {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            color: white;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }

        .btn-search:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3); }
        .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Results */
        .results-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            display: none;
        }

        .results-card.visible { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .result-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .quality-badge {
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quality-high { background: rgba(16,185,129,0.15); color: var(--accent-emerald); border: 1px solid rgba(16,185,129,0.3); }
        .quality-medium { background: rgba(245,158,11,0.15); color: var(--accent-amber); border: 1px solid rgba(245,158,11,0.3); }
        .quality-low { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.3); }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-primary);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .spec-item .key {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .spec-item .value {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .spec-item .value.null-val {
            color: var(--text-muted);
            font-style: italic;
            font-weight: 400;
        }

        .summary-box {
            padding: 1rem 1.2rem;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .source-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .source-info a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* Terminal Log */
        .log-card {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            margin-top: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #4ade80;
            display: none;
        }

        .log-card.visible { display: block; }

        .log-line {
            padding: 2px 0;
            opacity: 0.9;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .specs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Agentic Spec Retrieval</h1>
            <p>DuckDuckGo → BeautifulSoup → Gemini Verification Pipeline</p>
        </header>

        <!-- Pipeline Status Bar -->
        <div class="pipeline-bar">
            <div class="pipeline-step" id="step-search">🔍 DuckDuckGo</div>
            <span class="pipeline-arrow">→</span>
            <div class="pipeline-step" id="step-scrape">🕷️ BeautifulSoup</div>
            <span class="pipeline-arrow">→</span>
            <div class="pipeline-step" id="step-verify">🧠 Gemini</div>
        </div>

        <!-- Input Form -->
        <div class="input-card">
            <div class="form-grid">
                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" id="brand" placeholder="e.g. Samsung" value="Samsung">
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="model" placeholder="e.g. RT38" value="RT38">
                </div>
                <div class="form-group">
                    <label>Equipment Type</label>
                    <select id="equipmentType">
                        <option value="refrigerator">Refrigerator</option>
                        <option value="air conditioner">Air Conditioner</option>
                        <option value="microwave">Microwave</option>
                        <option value="washing machine">Washing Machine</option>
                    </select>
                </div>
            </div>
            <button class="btn-search" id="searchBtn" onclick="runPipeline()">
                🚀 Launch Agentic Pipeline
            </button>
        </div>

        <!-- Results -->
        <div class="results-card" id="resultsCard">
            <div class="result-header">
                <h2 id="resultTitle">—</h2>
                <span class="quality-badge" id="qualityBadge">—</span>
            </div>

            <div class="summary-box" id="summaryBox">—</div>

            <div class="specs-grid" id="specsGrid"></div>

            <div class="source-info" id="sourceInfo"></div>
        </div>

        <!-- Terminal Log -->
        <div class="log-card" id="logCard"></div>
    </div>

    <script>
        function log(msg) {
            const logCard = document.getElementById('logCard');
            logCard.classList.add('visible');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logCard.appendChild(line);
            logCard.scrollTop = logCard.scrollHeight;
        }

        function setStep(stepId, state) {
            const el = document.getElementById(stepId);
            el.classList.remove('active', 'done', 'error');
            if (state) el.classList.add(state);
        }

        function resetPipeline() {
            setStep('step-search', '');
            setStep('step-scrape', '');
            setStep('step-verify', '');
            document.getElementById('logCard').innerHTML = '';
        }

        async function runPipeline() {
            const brand = document.getElementById('brand').value.trim();
            const model = document.getElementById('model').value.trim();
            const equipmentType = document.getElementById('equipmentType').value;
            const btn = document.getElementById('searchBtn');
            const resultsCard = document.getElementById('resultsCard');

            if (!brand) { alert('Please enter a brand.'); return; }

            // Reset UI
            resetPipeline();
            resultsCard.classList.remove('visible');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Pipeline Running...';

            // Animate pipeline steps
            log('Starting Agentic Spec Retrieval Pipeline...');
            setStep('step-search', 'active');
            log(`🔍 Searching DuckDuckGo for: ${brand} ${model} ${equipmentType}...`);

            try {
                const response = await fetch('/api/spec-lookup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand, model, equipment_type: equipmentType })
                });

                setStep('step-search', 'done');
                log('✅ DuckDuckGo search complete.');
                setStep('step-scrape', 'active');
                log('🕷️ BeautifulSoup scraping product pages...');

                // Small delay for visual effect (the backend already did everything)
                await new Promise(r => setTimeout(r, 300));
                setStep('step-scrape', 'done');
                log('✅ Page content scraped successfully.');
                setStep('step-verify', 'active');
                log('🧠 Gemini verifying & extracting specs...');
                await new Promise(r => setTimeout(r, 300));

                const result = await response.json();

                if (result.success) {
                    setStep('step-verify', 'done');
                    log(`✅ Pipeline complete! Fields found: ${result.data.fields_found || 0}`);
                    renderResults(result.data);
                } else {
                    setStep('step-verify', 'error');
                    log(`❌ Error: ${result.error}`);
                }

            } catch (err) {
                setStep('step-search', 'error');
                log(`❌ Network Error: ${err.message}`);
            }

            btn.disabled = false;
            btn.innerHTML = '🚀 Launch Agentic Pipeline';
        }

        function renderResults(data) {
            const resultsCard = document.getElementById('resultsCard');
            const resultTitle = document.getElementById('resultTitle');
            const qualityBadge = document.getElementById('qualityBadge');
            const summaryBox = document.getElementById('summaryBox');
            const specsGrid = document.getElementById('specsGrid');
            const sourceInfo = document.getElementById('sourceInfo');

            // Title
            resultTitle.textContent = `${data.brand || '?'} ${data.model || '?'} — ${data.type || ''}`;

            // Quality Badge
            const quality = data.source_quality || 'low';
            qualityBadge.textContent = `${quality} quality · ${data.fields_found || 0} fields`;
            qualityBadge.className = `quality-badge quality-${quality}`;

            // Summary
            summaryBox.textContent = data.summary || 'No summary available.';

            // Specs Grid
            specsGrid.innerHTML = '';
            const specs = data.specs || {};
            const specLabels = {
                energy_class: '⚡ Energy Class',
                capacity: '📦 Capacity',
                refrigerant: '❄️ Refrigerant',
                inverter: '🔄 Inverter',
                dimensions: '📐 Dimensions',
                weight: '⚖️ Weight',
                color: '🎨 Color',
                noise_level: '🔊 Noise Level',
                warranty: '🛡️ Warranty',
                price: '💰 Price'
            };

            for (const [key, label] of Object.entries(specLabels)) {
                const value = specs[key];
                const item = document.createElement('div');
                item.className = 'spec-item';
                item.innerHTML = `
                    <span class="key">${label}</span>
                    <span class="value ${(!value || value === 'null') ? 'null-val' : ''}">${(!value || value === 'null') ? 'Not found' : value}</span>
                `;
                specsGrid.appendChild(item);
            }

            // Source
            const url = data.source_url || '';
            const pipeline = data.pipeline || '';
            sourceInfo.innerHTML = `
                <strong>Pipeline:</strong> ${pipeline}<br>
                ${url ? `<strong>Source:</strong> <a href="${url}" target="_blank">${url.substring(0, 80)}...</a>` : '<strong>Source:</strong> DuckDuckGo snippets (fallback)'}
            `;

            resultsCard.classList.add('visible');
        }
    </script>
</body>
</html>
