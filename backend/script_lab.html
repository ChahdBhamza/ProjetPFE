<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Script Lab - Manual Selection</title>
    <style>
        :root {
            --bg: #0a0c10;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --primary: #238636; 
            --accent: #58a6ff;
            --radius: 8px;
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;
        }

        .upload-zone {
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 2rem; text-align: center; cursor: pointer;
        }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem; margin-top: 1.5rem;
        }

        .frame { 
            border-radius: 4px; overflow: hidden; border: 2px solid transparent; 
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .frame.selected { border-color: var(--accent); transform: scale(0.98); box-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
        .frame img { width: 100%; display: block; }
        
        .badge {
            position: absolute; top: 5px; right: 5px;
            background: var(--primary); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 10px; display: none;
        }
        .frame.processed .badge { display: block; }

        .btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .controls-bar { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; }
        
        #ai-btn { background: var(--accent); display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎞️ Video Script Lab</h1>
        <p style="color:#8b949e">1. Upload & Deduplicate → 2. Select Frames → 3. Run Specialized AI</p>
    </header>

    <div class="card">
        <div class="upload-zone" id="drop-zone">
            <p id="upload-status">Drop video here or click to select</p>
            <input type="file" id="file-input" style="display:none" accept="video/*">
        </div>
        <div class="controls-bar">
            <button class="btn" id="extract-btn" disabled>Start Extraction</button>
            <button class="btn" id="ai-btn">Run Workflow on Selected (<span id="select-count">0</span>)</button>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    const API = 'http://localhost:8000';
    let currentSessionId = null;
    let selectedFrames = new Set();

    const fileInput = document.getElementById('file-input');
    const extractBtn = document.getElementById('extract-btn');
    const aiBtn = document.getElementById('ai-btn');
    const gallery = document.getElementById('gallery');
    const selectCount = document.getElementById('select-count');

    document.getElementById('drop-zone').onclick = () => fileInput.click();
    fileInput.onchange = () => {
        if (fileInput.files.length) {
            document.getElementById('upload-status').innerText = `Video: ${fileInput.files[0].name}`;
            extractBtn.disabled = false;
        }
    };

    extractBtn.onclick = async () => {
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        extractBtn.disabled = true;
        extractBtn.innerText = "Extracting...";
        
        try {
            const r = await fetch(`${API}/api/video/script-process`, { method: 'POST', body: fd });
            const data = await r.json();
            if (data.success) {
                currentSessionId = data.session_id;
                renderGallery(data.frames);
                aiBtn.style.display = 'block';
            }
        } catch (e) { alert(e.message); }
        extractBtn.innerText = "Start Extraction";
        extractBtn.disabled = false;
    };

    function renderGallery(frames) {
        gallery.innerHTML = '';
        frames.forEach(f => {
            const div = document.createElement('div');
            div.className = 'frame';
            div.dataset.filename = f.filename;
            div.innerHTML = `
                <img src="data:image/jpeg;base64,${f.image}">
                <div class="badge">AI PROCESSED</div>
            `;
            div.onclick = () => toggleSelect(div);
            gallery.appendChild(div);
        });
    }

    function toggleSelect(div) {
        const fname = div.dataset.filename;
        if (selectedFrames.has(fname)) {
            selectedFrames.delete(fname);
            div.classList.remove('selected');
        } else {
            selectedFrames.add(fname);
            div.classList.add('selected');
        }
        selectCount.innerText = selectedFrames.size;
        aiBtn.disabled = selectedFrames.size === 0;
    }

    aiBtn.onclick = async () => {
        if (selectedFrames.size === 0) return;
        aiBtn.disabled = true;
        aiBtn.innerText = "Processing AI...";

        try {
            const r = await fetch(`${API}/api/video/process-selected-frames`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    filenames: Array.from(selectedFrames)
                })
            });
            const data = await r.json();
            if (data.success) {
                updateFrames(data.frames);
            }
        } catch (e) { alert(e.message); }

        aiBtn.innerText = `Run Workflow on Selected (${selectedFrames.size})`;
        aiBtn.disabled = false;
    };

    function updateFrames(processedFrames) {
        processedFrames.forEach(f => {
            const div = Array.from(document.querySelectorAll('.frame')).find(d => d.dataset.filename === f.filename);
            if (div) {
                if (f.ai_image) {
                    const aiImg = document.createElement('img');
                    aiImg.src = `data:image/jpeg;base64,${f.ai_image}`;
                    aiImg.style.borderTop = '2px solid var(--accent)';
                    
                    const label = document.createElement('div');
                    label.style.background = 'var(--accent)';
                    label.style.color = 'black';
                    label.style.fontSize = '10px';
                    label.style.padding = '2px 4px';
                    label.style.textAlign = 'center';
                    label.innerText = 'AI Result (Visual)';
                    
                    div.appendChild(label);
                    div.appendChild(aiImg);
                } else if (f.raw_output) {
                    const label = document.createElement('div');
                    label.style.background = 'var(--text)';
                    label.style.color = 'black';
                    label.style.fontSize = '10px';
                    label.style.padding = '2px 4px';
                    label.style.textAlign = 'center';
                    label.innerText = 'AI Result (Data)';
                    
                    const pre = document.createElement('pre');
                    pre.style.fontSize = '10px';
                    pre.style.padding = '5px';
                    pre.style.background = '#000';
                    pre.style.overflow = 'auto';
                    pre.style.maxHeight = '150px';
                    // We try to extract just the predictions to avoid giant base64 strings
                    let displayData = f.raw_output;
                    pre.innerText = JSON.stringify(displayData, null, 2);
                    
                    div.appendChild(label);
                    div.appendChild(pre);
                }

                
                div.classList.add('processed');
                div.classList.remove('selected');
                selectedFrames.delete(f.filename);
            }
        });
        selectCount.innerText = selectedFrames.size;
        aiBtn.disabled = selectedFrames.size === 0;
    }
</script>

</body>
</html>
