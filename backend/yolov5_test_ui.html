<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv5 PC Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-box:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-box.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-text strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 100%;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            height: auto;
            display: block;
        }

        .detection-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .detection-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detection-label {
            font-weight: 600;
            color: #333;
        }

        .detection-confidence {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #3c3;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .save-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #2e7d32;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Computer Detection</h1>
        
        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <div class="upload-text">
                    <strong>Click to upload or drag and drop</strong>
                    <span>PNG, JPG, GIF up to 10MB</span>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            <button id="uploadBtn">Select Image</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image... Please wait</p>
        </div>

        <div class="results" id="results">
            <div class="canvas-wrapper">
                <canvas id="detectionCanvas"></canvas>
            </div>
            <div class="detection-info" id="detectionInfo"></div>
            <div class="button-group">
                <button id="downloadBtn">Download Result</button>
                <button id="saveAndNextBtn">Save & Scan Next</button>
                <button id="resetBtn">Upload Another Image</button>
            </div>
            <div class="save-message" id="saveMessage" style="display: none;"></div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const canvas = document.getElementById('detectionCanvas');
        const ctx = canvas.getContext('2d');
        const detectionInfo = document.getElementById('detectionInfo');
        const messageDiv = document.getElementById('message');
        const downloadBtn = document.getElementById('downloadBtn');
        const saveAndNextBtn = document.getElementById('saveAndNextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveMessage = document.getElementById('saveMessage');

        let currentImage = null;
        let lastDetectionData = null;

        // Upload box click
        uploadBox.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Drag and drop
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        // Upload button
        uploadBtn.addEventListener('click', () => fileInput.click());

        // Download button
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'detection_result.png';
            link.click();
        });

        // Save and next button
        saveAndNextBtn.addEventListener('click', () => {
            if (lastDetectionData && lastDetectionData.saved_file) {
                // Show save message
                saveMessage.style.display = 'block';
                saveMessage.innerHTML = `✓ Image saved: <strong>${lastDetectionData.saved_file}</strong>`;
                
                // Reset after 2 seconds
                setTimeout(() => {
                    resetForm();
                }, 2000);
            }
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            resetForm();
        });

        function resetForm() {
            fileInput.value = '';
            results.style.display = 'none';
            messageDiv.innerHTML = '';
            saveMessage.style.display = 'none';
            saveMessage.innerHTML = '';
            currentImage = null;
            lastDetectionData = null;
        }

        function handleFile(file) {
            // Validate file size (10MB)
            if (file.size > 10 * 1024 * 1024) {
                showMessage('File size too large. Max 10MB.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = new Image();
                currentImage.onload = () => {
                    sendForDetection(file);
                };
                currentImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function sendForDetection(file) {
            loading.style.display = 'block';
            results.style.display = 'none';
            messageDiv.innerHTML = '';

            const formData = new FormData();
            formData.append('file', file);

            fetch('/api/yolov5/detect', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                if (data.error) {
                    showMessage(data.error, 'error');
                } else {
                    displayResults(data);
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                showMessage('Error: ' + error.message, 'error');
            });
        }

        function displayResults(data) {
            // Store the detection data for save functionality
            lastDetectionData = data;

            // Draw image on canvas always
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);

            // Check if any laptops were detected
            if (data.detections.length === 0) {
                loading.style.display = 'none';
                results.style.display = 'block';
                detectionInfo.innerHTML = '<h3 style="color: #c33; text-align: center;">❌ That\'s not a laptop!</h3>';
                messageDiv.innerHTML = '';
                // Disable save button when no laptops detected
                saveAndNextBtn.disabled = true;
                downloadBtn.disabled = true;
                return;
            }

            // Enable buttons for valid detections
            saveAndNextBtn.disabled = false;
            downloadBtn.disabled = false;

            // Draw bounding boxes
            const colors = ['#00ff00', '#ff00ff', '#00ffff', '#ffff00', '#ff6600', '#00ff99'];
            data.detections.forEach((detection, index) => {
                const [x1, y1, x2, y2] = detection.bbox;
                const color = colors[index % colors.length];
                
                // Draw rectangle
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                // Draw label background
                ctx.fillStyle = color;
                const label = `${index + 1}. ${detection.class} ${(detection.confidence * 100).toFixed(1)}%`;
                const textWidth = ctx.measureText(label).width;
                ctx.fillRect(x1, y1 - 30, textWidth + 10, 25);

                // Draw label text
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(label, x1 + 5, y1 - 10);
            });

            // Display detections info
            let html = `<h3>🎯 Found ${data.detections.length} Object(s):</h3>`;
            if (data.detections.length === 0) {
                html += '<p style="color: #999;">No computers detected in this image.</p>';
            } else {
                data.detections.forEach((detection, index) => {
                    const colors = ['#00ff00', '#ff00ff', '#00ffff', '#ffff00', '#ff6600', '#00ff99'];
                    const color = colors[index % colors.length];
                    html += `
                        <div class="detection-item" style="border-left-color: ${color};">
                            <div>
                                <div class="detection-label" style="color: ${color};">
                                    <strong>#${index + 1}</strong> - ${detection.class.toUpperCase()}
                                </div>
                                <div style="color: #666; font-size: 12px;">Location: Box ${index + 1}</div>
                            </div>
                            <div class="detection-confidence">${(detection.confidence * 100).toFixed(1)}%</div>
                        </div>
                    `;
                });
            }
            detectionInfo.innerHTML = html;

            results.style.display = 'block';
            showMessage(`Detection complete! Found ${data.detections.length} object(s).`, 'success');
        }

        function showMessage(message, type) {
            messageDiv.className = type;
            messageDiv.innerHTML = message;
        }
    </script>
</body>
</html>
