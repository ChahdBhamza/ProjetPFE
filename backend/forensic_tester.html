<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersight | Forensic Pipeline Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c14;
            --card: #141824;
            --accent: #3b82f6;
            --text: #f1f5f9;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 { font-weight: 800; font-size: 2.5rem; margin: 0; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .upload-card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            margin-bottom: 40px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-block;
            margin: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .frame-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }
        .frame-card:hover { transform: scale(1.02); }
        .frame-card img { width: 100%; height: auto; display: block; }
        .frame-info {
            padding: 12px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
        }
        .tag {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cybersight Forensic Tester</h1>
            <p style="color: #64748b">Test the video processing pipeline directly from your browser</p>
        </header>

        <div class="upload-card">
            <label for="video-upload" class="btn">Select Video</label>
            <input type="file" id="video-upload" accept="video/*">
            <button id="process-btn" class="btn" disabled>Run Forensic Scan</button>
            <div id="loader" class="loader"></div>
            <div id="status">Ready. Select a video file to begin.</div>
        </div>

        <div id="gallery" class="gallery">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('video-upload');
        const processBtn = document.getElementById('process-btn');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const gallery = document.getElementById('gallery');

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                status.innerText = `Selected: ${fileInput.files[0].name}`;
                processBtn.disabled = false;
            }
        });

        processBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('video', file);

            // UI Feedback
            processBtn.disabled = true;
            loader.style.display = 'block';
            gallery.innerHTML = '';
            status.innerText = '📤 Uploading and processing video... (this may take a minute)';

            try {
                const response = await fetch('http://localhost:8000/api/video/script-process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    status.innerText = `✅ Success! Captured ${data.heros.length} Forensic Heroes.`;
                    
                    // Show Heroes First
                    if (data.heros && data.heros.length > 0) {
                        const heroHeader = document.createElement('h2');
                        heroHeader.innerText = "⭐ AI Forensic Heroes";
                        heroHeader.style.gridColumn = "1 / -1";
                        heroHeader.style.marginTop = "20px";
                        gallery.appendChild(heroHeader);
                        renderGallery(data.heros, true);
                    }

                    // Show Gallery Sample
                    const galleryHeader = document.createElement('h2');
                    galleryHeader.innerText = "🎞️ Video Gallery Sample";
                    galleryHeader.style.gridColumn = "1 / -1";
                    galleryHeader.style.marginTop = "40px";
                    gallery.appendChild(galleryHeader);
                    renderGallery(data.frames, false);
                } else {
                    status.innerText = `❌ Error: ${data.error || 'Unknown error'}`;
                }
            } catch (err) {
                console.error(err);
                status.innerText = `❌ Connection Error: Ensure backend is running on port 8000.`;
            } finally {
                loader.style.display = 'none';
                processBtn.disabled = false;
            }
        });

        function renderGallery(frames, isHeroShot = false) {
            frames.forEach(frame => {
                const card = document.createElement('div');
                card.className = 'frame-card';
                
                const imgSrc = `data:image/jpeg;base64,${frame.image}`;
                
                card.innerHTML = `
                    <img src="${imgSrc}" alt="Frame">
                    <div class="frame-info">
                        <span>${frame.filename}</span>
                        ${isHeroShot ? '<span class="tag">HERO SHOT</span>' : ''}
                    </div>
                `;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
