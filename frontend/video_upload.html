<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Upload to Detection Backend</title>
</head>
<body>
    <h2>Upload Video for Processing</h2>
    <form id="uploadForm" enctype="multipart/form-data" method="post" action="http://localhost:8000/video/extract-frames">
        <input type="file" name="file" accept="video/*" required />
        <br><br>
        <label>
            <input type="checkbox" name="auto_search" value="true"> Run Auto Search
        </label>
        <br><br>
        <button type="submit">Upload & Process</button>
    </form>
    <div id="result"></div>
    <script>
        const form = document.getElementById('uploadForm');
        form.onsubmit = async function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            document.getElementById('result').innerText = 'Uploading...';
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                document.getElementById('result').innerText = JSON.stringify(result, null, 2);
            } catch (err) {
                document.getElementById('result').innerText = 'Error: ' + err;
            }
        };
    </script>
</body>
</html>
